<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grammar & Spell Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #1a1614;
      --paper: #faf8f4;
      --cream: #f2ede3;
      --warm-mid: #e8dfc8;
      --accent: #c4451e;
      --accent-soft: #f5ebe6;
      --accent-hover: #a83718;
      --green: #2d6a4f;
      --green-soft: #e8f5ee;
      --gold: #b8860b;
      --gold-soft: #fdf6e3;
      --muted: #8a7f74;
      --border: #d9cfc0;
      --shadow: 0 4px 24px rgba(26,22,20,0.08);
      --shadow-lg: 0 12px 48px rgba(26,22,20,0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-mark {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .logo-mark span { color: var(--accent); }

    .logo-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-badge {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-family: 'DM Mono', monospace;
    }

    /* ── MAIN LAYOUT ── */
    main { max-width: 960px; margin: 0 auto; padding: 64px 24px 120px; }

    /* ── UPLOAD ZONE ── */
    .upload-section { text-align: center; }

    .upload-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .upload-headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .upload-subline {
      font-size: 17px;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 48px;
      line-height: 1.6;
    }

    .drop-zone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 64px 40px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: var(--cream);
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    .drop-icon {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: var(--paper);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
      font-size: 26px;
    }

    .drop-label { font-size: 17px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
    .drop-hint { font-size: 13px; color: var(--muted); }
    .drop-hint strong { color: var(--accent); }

    .file-name-pill {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      max-width: 560px;
      margin: 0 auto 24px;
      font-size: 14px;
      font-family: 'DM Mono', monospace;
      color: var(--ink);
      animation: slideUp 0.3s ease;
    }

    .file-name-pill.visible { display: flex; }

    .file-icon { font-size: 20px; }

    .file-remove {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      transition: color 0.15s;
    }
    .file-remove:hover { color: var(--accent); }

    .btn-analyze {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 16px 36px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    .btn-analyze:hover { background: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-analyze .btn-spinner { display: none; }
    .btn-analyze.loading .btn-spinner { display: inline-block; }
    .btn-analyze.loading .btn-text { display: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      animation: slideUp 0.4s ease;
    }

    .stats-bar.visible { display: grid; }

    .stat-cell {
      background: var(--paper);
      padding: 20px 28px;
      text-align: center;
    }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 500; }
    .stat-cell:nth-child(2) .stat-number { color: var(--accent); }
    .stat-cell:nth-child(3) .stat-number { color: var(--green); }

    /* ── RESULTS ── */
    #results-section { display: none; animation: slideUp 0.5s ease; }
    #results-section.visible { display: block; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .results-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
    }

    .progress-track {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    #progress-text { color: var(--ink); font-weight: 500; }

    /* ── ISSUE CARD ── */
    .issue-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(26,22,20,0.04);
    }

    .issue-card.resolved {
      opacity: 0.45;
      transform: scale(0.985);
    }

    .issue-card.accepted { border-left: 4px solid var(--green); }
    .issue-card.declined { border-left: 4px solid var(--muted); }

    .card-top {
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .para-chip {
      flex-shrink: 0;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .sentence-block { flex: 1; }

    .sentence-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .error-highlight {
      background: #fde8e4;
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      border-radius: 2px;
      padding: 0 1px;
      font-weight: 500;
    }

    .error-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── ERRORS LIST ── */
    .errors-list { border-top: 1px solid var(--border); }

    .error-item {
      padding: 16px 24px;
      border-bottom: 1px solid var(--cream);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
    }

    .error-item:last-child { border-bottom: none; }

    .error-item.resolved-item { background: var(--cream); }

    .error-info {}
    .error-message { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
    .error-word { font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; font-size: 13px; }

    /* ── SUGGESTIONS ── */
    .suggestions-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .suggestions-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .suggestion-btn {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--ink);
      font-weight: 500;
    }

    .suggestion-btn:hover {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .suggestion-btn.selected {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    /* ── ACTION BUTTONS ── */
    .error-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

    .btn-accept {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 7px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-accept:hover { background: var(--green); color: white; }
    .btn-accept:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-decline {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-decline:hover { background: var(--cream); color: var(--ink); border-color: var(--muted); }

    .btn-undo {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 5px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
      opacity: 0.85;
    }
    .btn-undo:hover { background: var(--gold-soft); opacity: 1; }

    .resolved-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500; padding: 5px 12px;
      border-radius: 7px;
    }

    .resolved-badge.accepted-badge { background: var(--green-soft); color: var(--green); }
    .resolved-badge.declined-badge { background: var(--cream); color: var(--muted); }

    /* ── CLEAN CARDS ── */
    .clean-card {
      background: var(--green-soft);
      border: 1px solid #a8d5be;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .clean-icon { font-size: 22px; }
    .clean-text { font-size: 14px; color: var(--green); line-height: 1.5; }
    .clean-text strong { font-weight: 600; }

    /* ── DOWNLOAD SECTION ── */
    #download-section {
      display: none;
      margin-top: 48px;
      padding: 40px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
      animation: slideUp 0.4s ease;
    }

    #download-section.visible { display: block; }

    .download-headline {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .download-sub { font-size: 15px; color: var(--muted); margin-bottom: 28px; }

    .download-summary {
      display: inline-flex;
      gap: 24px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 24px;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--muted);
    }

    .download-summary span strong { color: var(--ink); }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-download:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-lg); }

    /* ── COMPLETE BANNER ── */
    #complete-banner {
      display: none;
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      gap: 10px;
      align-items: center;
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #complete-banner.visible { display: flex; }

    /* ── ANIMATIONS ── */
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popUp { from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DIVIDER ── */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      header { padding: 0 20px; }
      main { padding: 40px 16px 80px; }
      .error-item { grid-template-columns: 1fr; }
      .error-actions { flex-direction: row; }
    }

    .para-chips-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .table-chip {
      background: #eef3fb;
      border-color: #a8bfdf;
      color: #2c5282;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #2c5282;
      background: #eef3fb;
      border: 1px solid #a8bfdf;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    .occurrence-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid #e8d08a;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    /* ── GROUPED DUPLICATE CARD ── */
    .grouped-card {
      border-left: 4px solid var(--gold);
      background: var(--gold-soft);
    }

    .grouped-card.resolved {
      opacity: 0.45;
      transform: scale(0.985);
    }

    .group-icon {
      flex-shrink: 0;
      width: 36px; height: 36px;
      background: #faedb5;
      border: 1px solid #e8d08a;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      color: var(--gold);
    }

    .group-count-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--gold);
      background: #faedb5;
      border: 1px solid #e8d08a;
      padding: 2px 10px;
      border-radius: 20px;
    }

    .group-error-body {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .group-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .btn-accept-all {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 7px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-accept-all:hover { background: var(--green); color: white; }

    .btn-decline-all {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-decline-all:hover { background: var(--cream); color: var(--ink); border-color: var(--muted); }

    .group-sentences-toggle {
      padding: 10px 24px;
      border-top: 1px solid #e8d08a;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.3px;
      user-select: none;
      transition: background 0.15s;
    }
    .group-sentences-toggle:hover { background: #faedb5; }

    .group-sentences-list {
      border-top: 1px solid #e8d08a;
    }

    .group-sentence-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 24px;
      border-bottom: 1px solid #f0e8c8;
      font-size: 14px;
      line-height: 1.6;
    }
    .group-sentence-row:last-child { border-bottom: none; }

  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"><span>Grammar and Spell Check</span></div>
    <div class="logo-sub">Document Editor</div>
  </div>
  <div class="header-badge">en-US · LanguageTool</div>
</header>

<main>

  <!-- ANALYSE SECTION — no file upload; document comes from the session -->
  <section class="upload-section" id="upload-section">
    <div class="upload-eyebrow">Grammar & Style Analysis</div>
    <h1 class="upload-headline">Polish your prose,<br/>word by word.</h1>
    <p class="upload-subline">Your document has been uploaded. Click below to detect grammar and spelling issues.</p>

    <div>
      <button class="btn-analyze" id="analyze-btn">
        <span class="btn-text">✦ &nbsp;Analyze Document</span>
        <span class="btn-spinner"><span class="spinner"></span></span>
      </button>
    </div>
  </section>

  <hr class="section-divider" id="divider" style="display:none"/>

  <!-- STATS BAR -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-cell">
      <div class="stat-number" id="stat-sentences">0</div>
      <div class="stat-label">Sentences</div>
    </div>
    <div class="stat-cell">
      <div class="stat-number" id="stat-issues">0</div>
      <div class="stat-label">Issues Found</div>
    </div>
    <div class="stat-cell">
      <div class="stat-number" id="stat-resolved">0</div>
      <div class="stat-label">Resolved</div>
    </div>
  </div>

  <!-- RESULTS SECTION -->
  <section id="results-section">
    <div class="results-header">
      <h2 class="results-title">Review Issues</h2>
      <div class="progress-track"><span id="progress-text">0</span> of <span id="progress-total">0</span> resolved</div>
    </div>
    <div id="issues-container"></div>
  </section>

</main>

<script>
// ── STATE ──
let reportData = [];
let decisions  = {};
let totalIssues   = 0;
let resolvedCount = 0;

// groupMap: { groupKey → { keys: ['si_ei', ...], suggestions: [...], resolved: false } }
// Used by grouped (duplicate) error cards only.
let groupMap = {};

// ── ELEMENTS ──
const analyzeBtn      = document.getElementById('analyze-btn');
const statsBar        = document.getElementById('stats-bar');
const resultsSection  = document.getElementById('results-section');
const issuesContainer = document.getElementById('issues-container');
const divider         = document.getElementById('divider');

// ── ANALYZE ──
analyzeBtn.addEventListener('click', async () => {
  analyzeBtn.classList.add('loading');
  analyzeBtn.disabled = true;
  try {
    const res  = await fetch('', { method: 'POST', body: new FormData() });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResults(data);
    window.parent.postMessage({ type: 'toolDirty' }, '*');
  } catch (err) {
    console.error(err);
    alert('An error occurred: ' + err.message);
  } finally {
    analyzeBtn.classList.remove('loading');
    analyzeBtn.disabled = false;
  }
});

// ── tabResumed ──
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'tabResumed') {
    reportData    = [];
    decisions     = {};
    groupMap      = {};
    totalIssues   = 0;
    resolvedCount = 0;
    statsBar.classList.remove('visible');
    resultsSection.classList.remove('visible');
    issuesContainer.innerHTML = '';
    divider.style.display = 'none';
    const subline = document.querySelector('.upload-subline');
    if (subline) subline.textContent = 'The document was updated by another tool. Click Analyze to reload.';
    window.parent.postMessage({ type: 'toolClean' }, '*');
  }
});

// ── RENDER RESULTS ──
function renderResults(data) {
  reportData = data.report;
  decisions  = {};
  groupMap   = {};
  resolvedCount = 0;
  totalIssues   = 0;

  // Filter errors without suggestions; count total individual instances
  reportData.forEach(item => {
    item.errors = item.errors.filter(err => err.suggestions && err.suggestions.length > 0);
    totalIssues += item.errors.length;
  });

  // Stats
  document.getElementById('stat-sentences').textContent = data.sentence_count;
  document.getElementById('stat-issues').textContent    = totalIssues;
  document.getElementById('stat-resolved').textContent  = '0';
  document.getElementById('progress-total').textContent = totalIssues;
  document.getElementById('progress-text').textContent  = '0';

  statsBar.classList.add('visible');
  divider.style.display = 'block';
  resultsSection.classList.add('visible');
  issuesContainer.innerHTML = '';

  if (totalIssues === 0) {
    issuesContainer.innerHTML = `
      <div class="clean-card">
        <span class="clean-icon">✅</span>
        <div class="clean-text"><strong>No issues found!</strong><br/>Your document looks great — no grammar or spelling errors detected.</div>
      </div>`;
    showDownload();
    return;
  }

  // ── Build duplicate-group index ────────────────────────────────────────
  // key = error_text + "|||" + message
  // groupIndex: { groupKey → [{ si, ei, item, err }] }
  const groupIndex = {};
  reportData.forEach((item, si) => {
    item.errors.forEach((err, ei) => {
      const gk = (err.error_text || '') + '|||' + err.message;
      if (!groupIndex[gk]) groupIndex[gk] = [];
      groupIndex[gk].push({ si, ei, item, err });
    });
  });

  // Separate singleton keys (appear once) vs duplicate keys (appear 2+)
  const duplicateKeys = new Set(
    Object.keys(groupIndex).filter(gk => groupIndex[gk].length > 1)
  );

  // Track which si_ei instances are handled inside a grouped card
  const handledInGroup = new Set();

  // Render grouped cards first (top of list — one card per duplicate group)
  duplicateKeys.forEach(gk => {
    const instances = groupIndex[gk];
    const { err } = instances[0];
    const instanceKeys = instances.map(({ si, ei }) => `${si}_${ei}`);
    instanceKeys.forEach(k => handledInGroup.add(k));

    // Register in groupMap
    groupMap[gk] = { keys: instanceKeys, resolved: false };

    const card = document.createElement('div');
    card.className = 'issue-card grouped-card';
    card.id = `group-card-${CSS.escape(gk)}`;

    const suggestionsArr = (err.suggestions || []).slice(0, 6);
    const suggestionsHTML = suggestionsArr.map(s =>
      `<button class="suggestion-btn" data-group-suggest="${escAttr(gk)}" data-val="${escAttr(s)}">${escHtml(s)}</button>`
    ).join('');

    // Collapsible sentence list
    const sentenceRows = instances.map(({ si, ei, item: itm }) => {
      const label = (itm.occurrence_labels || [itm.location_label || `¶${itm.paragraph}`])[0];
      const icon  = label.startsWith('T') ? '⊞' : '¶';
      const cls   = label.startsWith('T') ? 'para-chip table-chip' : 'para-chip';
      const highlighted = buildHighlightedSentence(itm.sentence, [err]);
      return `
        <div class="group-sentence-row" id="gsr-${si}_${ei}">
          <span class="${cls}" style="margin-top:2px;flex-shrink:0;">${icon} ${escHtml(label)}</span>
          <span class="sentence-text" style="font-size:14px;margin-bottom:0;">${highlighted}</span>
        </div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-top" style="align-items:center;">
        <div class="group-icon">⟳</div>
        <div class="sentence-block">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
            <span class="error-word" style="font-size:15px;">"${escHtml(err.error_text)}"</span>
            <span class="group-count-badge">${instances.length} occurrences</span>
          </div>
          <div class="error-message" style="margin-bottom:0;">${escHtml(err.message)}</div>
        </div>
      </div>
      <div class="errors-list">
        <div class="group-error-body">
          <div>
            <div class="suggestions-label">Suggestions</div>
            <div class="suggestions-row" id="group-suggestions-${escAttr(gk)}">${suggestionsHTML}</div>
          </div>
          <div class="group-actions" id="group-actions-${escAttr(gk)}">
            <button class="btn-accept-all" data-group-accept="${escAttr(gk)}">✓ Accept all</button>
            <button class="btn-decline-all" data-group-decline="${escAttr(gk)}">✕ Ignore all</button>
          </div>
        </div>
        <div class="group-sentences-toggle" data-group-toggle="${escAttr(gk)}">
          <span class="toggle-label">▸ Show ${instances.length} affected sentences</span>
        </div>
        <div class="group-sentences-list" id="group-sentences-${escAttr(gk)}" style="display:none;">
          ${sentenceRows}
        </div>
      </div>`;

    issuesContainer.appendChild(card);
  });

  // Render singleton cards (one card per sentence that has non-grouped errors)
  reportData.forEach((item, si) => {
    const singletonErrors = item.errors.filter((_, ei) => !handledInGroup.has(`${si}_${ei}`));
    if (singletonErrors.length === 0) return;

    const card = document.createElement('div');
    card.className = 'issue-card';
    card.id = `card-${si}`;

    const highlightedSentence = buildHighlightedSentence(item.sentence, singletonErrors);
    const errorsHTML = singletonErrors.map((err, localEi) => {
      // Find the real ei in the full errors array
      const realEi = item.errors.indexOf(err);
      return buildErrorItem(err, si, realEi);
    }).join('');

    const labels = item.occurrence_labels || [item.location_label || `¶${item.paragraph}`];
    const isTable = item.source === 'table';
    const locationChips = labels.map(l => {
      const icon = l.startsWith('T') ? '⊞' : '¶';
      const cls  = l.startsWith('T') ? 'para-chip table-chip' : 'para-chip';
      return `<span class="${cls}">${icon} ${l}</span>`;
    }).join('');
    const occurrenceBadge = labels.length > 1
      ? `<span class="occurrence-badge">⟳ Repeats ${labels.length}× — correction will apply to all</span>`
      : '';
    const sourceBadge = isTable ? `<span class="source-badge">⊞ Table text</span>` : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="para-chips-row">${locationChips}</div>
        <div class="sentence-block">
          <div class="sentence-text">${highlightedSentence}</div>
          <div class="badges-row">
            <span class="error-count-badge">⚠ ${singletonErrors.length} issue${singletonErrors.length > 1 ? 's' : ''}</span>
            ${sourceBadge}
            ${occurrenceBadge}
          </div>
        </div>
      </div>
      <div class="errors-list">${errorsHTML}</div>`;

    issuesContainer.appendChild(card);
  });

  // ── Attach listeners ──
  // Singleton accept / decline
  document.querySelectorAll('[data-accept]').forEach(btn => {
    btn.addEventListener('click', () => acceptError(btn.dataset.accept));
  });
  document.querySelectorAll('[data-decline]').forEach(btn => {
    btn.addEventListener('click', () => declineError(btn.dataset.decline));
  });
  document.querySelectorAll('[data-suggest]').forEach(btn => {
    btn.addEventListener('click', () => selectSuggestion(btn));
  });

  // Group accept / decline / suggest / toggle
  document.querySelectorAll('[data-group-accept]').forEach(btn => {
    btn.addEventListener('click', () => acceptGroup(btn.dataset.groupAccept));
  });
  document.querySelectorAll('[data-group-decline]').forEach(btn => {
    btn.addEventListener('click', () => declineGroup(btn.dataset.groupDecline));
  });
  document.querySelectorAll('[data-group-suggest]').forEach(btn => {
    btn.addEventListener('click', () => selectGroupSuggestion(btn));
  });
  document.querySelectorAll('[data-group-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleGroupSentences(el.dataset.groupToggle));
  });

  resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── GROUP HELPERS ──────────────────────────────────────────────────────────

function selectGroupSuggestion(btn) {
  const gk = btn.dataset.groupSuggest;
  document.querySelectorAll(`[data-group-suggest="${CSS.escape(gk)}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  if (!groupMap[gk]) groupMap[gk] = {};
  groupMap[gk].selectedSuggestion = btn.dataset.val;
}

function getGroupSuggestion(gk) {
  // Return currently selected suggestion for this group, or auto-select first
  const row = document.getElementById(`group-suggestions-${gk}`);
  if (!row) return null;
  const selected = row.querySelector('.suggestion-btn.selected');
  if (selected) return selected.dataset.val;
  const first = row.querySelector('.suggestion-btn');
  if (first) { first.classList.add('selected'); return first.dataset.val; }
  return null;
}

function acceptGroup(gk) {
  const suggestion = getGroupSuggestion(gk);
  const group = groupMap[gk];
  if (!group) return;
  group.keys.forEach(key => {
    decisions[key] = { action: 'accept', suggestion };
  });
  markGroupResolved(gk, 'accept', group.keys.length);
}

function declineGroup(gk) {
  const group = groupMap[gk];
  if (!group) return;
  group.keys.forEach(key => {
    decisions[key] = { action: 'decline', suggestion: null };
  });
  markGroupResolved(gk, 'decline', group.keys.length);
}

function markGroupResolved(gk, action, count) {
  const actionsEl = document.getElementById(`group-actions-${gk}`);
  if (actionsEl) {
    const label = action === 'accept'
      ? `<span class="resolved-badge accepted-badge">✓ Accepted all ${count}</span>`
      : `<span class="resolved-badge declined-badge">✕ Ignored all ${count}</span>`;
    actionsEl.innerHTML = label + `<button class="btn-undo" data-group-undo="${escAttr(gk)}" title="Undo all">↩ Undo all</button>`;
    actionsEl.querySelector('[data-group-undo]').addEventListener('click', () => undoGroup(gk));
  }
  const card = document.getElementById(`group-card-${CSS.escape(gk)}`);
  if (card) card.classList.add('resolved');

  resolvedCount += count;
  document.getElementById('stat-resolved').textContent = resolvedCount;
  document.getElementById('progress-text').textContent = resolvedCount;
  if (resolvedCount >= totalIssues) setTimeout(() => showDownload(), 400);
}

function undoGroup(gk) {
  const group = groupMap[gk];
  if (!group) return;
  const count = group.keys.length;
  group.keys.forEach(key => { delete decisions[key]; });

  const actionsEl = document.getElementById(`group-actions-${gk}`);
  if (actionsEl) {
    actionsEl.innerHTML = `
      <button class="btn-accept-all" data-group-accept="${escAttr(gk)}">✓ Accept all</button>
      <button class="btn-decline-all" data-group-decline="${escAttr(gk)}">✕ Ignore all</button>`;
    actionsEl.querySelector('[data-group-accept]').addEventListener('click', () => acceptGroup(gk));
    actionsEl.querySelector('[data-group-decline]').addEventListener('click', () => declineGroup(gk));
  }

  const card = document.getElementById(`group-card-${CSS.escape(gk)}`);
  if (card) card.classList.remove('resolved');

  resolvedCount -= count;
  document.getElementById('stat-resolved').textContent = resolvedCount;
  document.getElementById('progress-text').textContent = resolvedCount;
}

function toggleGroupSentences(gk) {
  const list = document.getElementById(`group-sentences-${gk}`);
  const toggle = document.querySelector(`[data-group-toggle="${CSS.escape(gk)}"] .toggle-label`);
  if (!list || !toggle) return;
  const open = list.style.display !== 'none';
  list.style.display = open ? 'none' : 'block';
  const count = groupMap[gk] ? groupMap[gk].keys.length : '';
  toggle.textContent = open
    ? `▸ Show ${count} affected sentences`
    : `▾ Hide affected sentences`;
}

// ── SINGLETON HELPERS ──────────────────────────────────────────────────────

function buildHighlightedSentence(sentence, errors) {
  let result = escHtml(sentence);
  const seen = new Set();
  errors.forEach(err => {
    if (!err.error_text || seen.has(err.error_text)) return;
    seen.add(err.error_text);
    const escaped = escHtml(err.error_text);
    result = result.replace(escaped, `<span class="error-highlight">${escaped}</span>`);
  });
  return result;
}

function buildErrorItem(err, si, ei) {
  const key = `${si}_${ei}`;
  const suggestionsArr = (err.suggestions || []).slice(0, 6);
  const suggestionsHTML = suggestionsArr.length > 0
    ? `<div class="suggestions-label">Suggestions</div>
       <div class="suggestions-row">
         ${suggestionsArr.map(s => `<button class="suggestion-btn" data-suggest="${key}" data-val="${escAttr(s)}">${escHtml(s)}</button>`).join('')}
       </div>`
    : '';

  return `
    <div class="error-item" id="error-item-${key}">
      <div class="error-info">
        <div class="error-message">
          ${err.error_text ? `<span class="error-word">"${escHtml(err.error_text)}"</span> — ` : ''}
          ${escHtml(err.message)}
        </div>
        ${suggestionsHTML}
      </div>
      <div class="error-actions" id="actions-${key}">
        <button class="btn-accept" data-accept="${key}">✓ Accept</button>
        <button class="btn-decline" data-decline="${key}">✕ Ignore</button>
      </div>
    </div>`;
}

function selectSuggestion(btn) {
  const key = btn.dataset.suggest;
  document.querySelectorAll(`[data-suggest="${key}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  if (!decisions[key]) decisions[key] = {};
  decisions[key].suggestion = btn.dataset.val;
}

function acceptError(key) {
  const row = document.querySelector(`#error-item-${key} .suggestions-row`);
  let suggestion = null;
  if (row) {
    const selected = row.querySelector('.suggestion-btn.selected');
    if (!selected) {
      const first = row.querySelector('.suggestion-btn');
      if (first) { first.classList.add('selected'); suggestion = first.dataset.val; }
    } else {
      suggestion = selected.dataset.val;
    }
  }
  decisions[key] = { action: 'accept', suggestion };
  markResolved(key, 'accept');
}

function declineError(key) {
  decisions[key] = { action: 'decline', suggestion: null };
  markResolved(key, 'decline');
}

function markResolved(key, action) {
  const actionsEl = document.getElementById(`actions-${key}`);
  const itemEl    = document.getElementById(`error-item-${key}`);
  if (actionsEl) {
    const label = action === 'accept'
      ? `<span class="resolved-badge accepted-badge">✓ Accepted</span>`
      : `<span class="resolved-badge declined-badge">✕ Ignored</span>`;
    actionsEl.innerHTML = label + `<button class="btn-undo" data-undo="${key}" title="Undo">↩ Undo</button>`;
    actionsEl.querySelector('[data-undo]').addEventListener('click', () => undoError(key));
  }
  if (itemEl) itemEl.classList.add('resolved-item');

  resolvedCount++;
  document.getElementById('stat-resolved').textContent = resolvedCount;
  document.getElementById('progress-text').textContent = resolvedCount;
  if (resolvedCount >= totalIssues) setTimeout(() => showDownload(), 400);
}

function undoError(key) {
  delete decisions[key];
  const actionsEl = document.getElementById(`actions-${key}`);
  const itemEl    = document.getElementById(`error-item-${key}`);
  if (actionsEl) {
    actionsEl.innerHTML = `
      <button class="btn-accept" data-accept="${key}">✓ Accept</button>
      <button class="btn-decline" data-decline="${key}">✕ Ignore</button>`;
    actionsEl.querySelector('[data-accept]').addEventListener('click', () => acceptError(key));
    actionsEl.querySelector('[data-decline]').addEventListener('click', () => declineError(key));
  }
  document.querySelectorAll(`[data-suggest="${key}"]`).forEach(b => b.classList.remove('selected'));
  if (itemEl) itemEl.classList.remove('resolved-item');

  resolvedCount--;
  document.getElementById('stat-resolved').textContent = resolvedCount;
  document.getElementById('progress-text').textContent = resolvedCount;
}

// ── DOWNLOAD ──────────────────────────────────────────────────────────────

async function showDownload() {
  try {
    const formData = new FormData();
    formData.append('decisions',     JSON.stringify(decisions));
    formData.append('report',        JSON.stringify(reportData));
    formData.append('original_name', 'document.docx');
    const res = await fetch('download', { method: 'POST', body: formData });
    if (!res.ok) throw new Error('Failed to apply corrections');
    await res.blob();
  } catch (err) {
    alert('Error applying corrections: ' + err.message);
    return;
  }
  window.parent.postMessage({ type: 'taskComplete' }, '*');
}

// ── UTILS ────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
